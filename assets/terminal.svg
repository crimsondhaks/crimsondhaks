<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
  <title id="title">Dhaks's animated developer terminal</title>
  <desc id="desc">A dark terminal that introduces Dhaks with three lightly sarcastic developer status lines.</desc>

  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3178c6"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#f05138"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.6" opacity="0.45"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .chrome { fill: #8b949e; font-size: 14px; }
      .prompt { fill: #7ee787; font-size: 18px; font-weight: 700; }
      .command { fill: #f0f6fc; font-size: 18px; }
      .output { fill: #79c0ff; font-size: 18px; }
      .frame { stroke-dasharray: 18 10; animation: border-march 8s linear infinite; }
      .cursor { animation: cursor-blink 1s steps(1, end) infinite; }
      @keyframes border-march { to { stroke-dashoffset: -280; } }
      @keyframes cursor-blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .frame, .cursor { animation: none; }
        .cursor { opacity: 1; }
      }
    </style>
  </defs>

  <rect x="4" y="4" width="892" height="302" rx="18" fill="url(#surface)"/>
  <rect x="5.5" y="5.5" width="889" height="299" rx="16.5" fill="none" stroke="url(#border)" stroke-width="3" class="frame"/>
  <rect x="6" y="46" width="888" height="258" rx="0" fill="url(#grid)" opacity="0.5"/>
  <path d="M 6 46 H 894" stroke="#30363d" stroke-width="1"/>

  <circle cx="27" cy="26" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="26" r="6" fill="#ffbd2e"/>
  <circle cx="69" cy="26" r="6" fill="#27c93f"/>
  <text x="92" y="31" class="chrome">dhaks@github — zsh — 80×24</text>
  <circle cx="864" cy="26" r="5" fill="#3fb950" filter="url(#glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="778" y="31" class="chrome">online-ish</text>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.1;0.92;1" dur="10s" repeatCount="indefinite"/>
    <text x="28" y="82" class="prompt">$</text>
    <text x="52" y="82" class="command">whoami</text>
    <text x="52" y="111" class="output">Dhaks — generalist developer; professional tab collector.</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.3;0.92;1" dur="10s" repeatCount="indefinite"/>
    <text x="28" y="152" class="prompt">$</text>
    <text x="52" y="152" class="command">mission --today</text>
    <text x="52" y="181" class="output">Ship useful software. Pretend the first deploy was intentional.</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.92;1" dur="10s" repeatCount="indefinite"/>
    <text x="28" y="222" class="prompt">$</text>
    <text x="52" y="222" class="command">stack --status</text>
    <text x="52" y="251" class="output">frontend ✓  backend ✓  infra ✓  docs... eventually</text>
  </g>

  <text x="28" y="284" class="prompt">$</text>
  <rect x="52" y="269" width="10" height="19" rx="1" fill="#f0f6fc" class="cursor"/>
</svg>
